databases:
  - name: hospital-api-db
    plan: basic-256mb
    databaseName: api_production
    user: api

services:
  - type: web
    name: hospital-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-api-db
          property: connectionString
